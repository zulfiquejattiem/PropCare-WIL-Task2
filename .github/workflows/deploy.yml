name: CD - Deploy to Render

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      hook_url:
        description: "Optional Render Deploy Hook URL. Leave empty to use the RENDER_DEPLOY_HOOK_URL repository secret."
        required: false
        type: string

jobs:
  deploy:
    name: Deploy PropCare (Render)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          # This pipeline runs `npm test` and `npm run check`, neither of which
          # needs a browser. Only the separate `npm run test:browser` script
          # does, and it is not part of the deploy gate.
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Select Render deploy hook
        id: hook
        env:
          INPUT_HOOK_URL: ${{ inputs.hook_url }}
          SECRET_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$INPUT_HOOK_URL" ]; then
            echo "Using the manually supplied Render deploy hook."
            echo "url=$INPUT_HOOK_URL" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SECRET_HOOK_URL" ]; then
            echo "Using the RENDER_DEPLOY_HOOK_URL repository secret."
            echo "url=$SECRET_HOOK_URL" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Render deploy hook configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy hook
        id: render
        if: steps.hook.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ steps.hook.outputs.url }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            -X POST \
            "$RENDER_DEPLOY_HOOK_URL"

          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Confirmed deploy requested
        if: steps.render.outputs.deployed == 'true'
        run: |
          echo "Render deploy hook triggered successfully."
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"

      - name: Deploy skipped
        if: steps.hook.outputs.configured != 'true'
        run: |
          echo "::warning::Render deployment was not triggered."
          echo "::warning::Configure the RENDER_DEPLOY_HOOK_URL repository secret or provide hook_url when manually running this workflow."

      - name: Wait for Render deployment
        if: steps.render.outputs.deployed == 'true'
        env:
          RENDER_SERVICE_URL: https://propcare-wil-task2.onrender.com
        run: |
          echo "Waiting for Render deployment to become healthy..."

          for attempt in {1..30}; do
            echo "Health check attempt $attempt/30..."

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 15 \
              "$RENDER_SERVICE_URL/api/health" > /tmp/health.json; then

              echo "Render health check succeeded."
              cat /tmp/health.json
              exit 0
            fi

            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done

          echo "::error::Render deployment was triggered, but the health endpoint did not become healthy within 5 minutes."
          exit 1