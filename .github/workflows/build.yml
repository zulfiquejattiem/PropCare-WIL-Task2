name: Build, Test and Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate prototype HTML
        run: |
          for f in prototype/*.html; do
            echo "Checking $f"
            npx --yes html-validate "$f"
          done
      - name: Validate JavaScript syntax
        run: |
          for f in prototype/js/*.js prototype/data/*.js; do
            node --check "$f"
          done
      - name: Check README present
        run: |
          test -f "README.md" && echo "README present"
      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: prototype
          path: prototype
          retention-days: 5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}prototype/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Deployment Complete
        run: |
          echo "✅ Deploy complete!"
          echo "🚀 Live at: https://zulfique.github.io/PropCare-WIL-Task2/prototype/"
