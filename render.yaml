# Render Blueprint for PropCare WIL Task 2.
# Applies automatically when this file is present at the repo root and the repo
# is connected to Render (or via "New + > Blueprint").
services:
  - type: web
    name: propcare-wil-task2
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node --experimental-sqlite server.js
    healthCheckPath: /api/health
    disk:
      name: propcare-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: DB_PATH
        value: /data/propcare.db
      # Generate a long random value (>= 32 chars) in the Render dashboard.
      - key: JWT_SECRET
        sync: false
      # Configure this password in Render.
      - key: DEMO_PASSWORD
        sync: false